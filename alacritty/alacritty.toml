# $HOME/.config/alacritty/alacritty.toml
# by Rito Ghosh 2023-10-06

[general]
live_config_reload = true


[window]

opacity = 0.9

padding.x = 0
padding.y = 0

decorations = "Full"
decorations_theme_variant = "Dark" # "Light" # "Dark"

[font]
normal = { family = "MesloLGLDZ Nerd Font", style = "Regular" }
bold = { family = "MesloLGLDZ Nerd Font", style = "Bold" }
italic = { family = "MesloLGLDZ Nerd Font", style = "Italic" }
bold_italic = { family = "MesloLGLDZ Nerd Font", style = "Bold Italic" }
size = 11.0

[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
#  { key = "T", mods = "Control|Shift", action = "CreateNewTab" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
]


[terminal.shell]
program = "/usr/bin/byobu"
#args = ["-s", "default"]  # Adjust session name as needed
